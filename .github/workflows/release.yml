name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tagged package to npm
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: inputs.publish == true && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Require the exact package version tag
        run: |
          expected="v$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_TYPE" = "tag"
          test "$GITHUB_REF_NAME" = "$expected"
      - name: Ensure OIDC-capable npm
        run: npm install --global npm@11.5.1
      - run: npm --version
      - run: npm ci
      - run: npm run verify:package
      - run: npm audit --omit=dev
      - name: "Publish (dist-tag derived from version: alpha/beta/rc, else latest)"
        run: |
          TAG="$(node -p "const v=require('./package.json').version; v.includes('-') ? v.split('-')[1].split('.')[0] : 'latest'")"
          npm publish --access public --provenance --tag "$TAG"
