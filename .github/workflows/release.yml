name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tagged package to npm
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: inputs.publish == true && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Ensure OIDC-capable npm
        run: npm install --global npm@11.5.1
      - run: npm --version
      - run: npm ci
      - run: npm run check
      - run: npm publish --access public --provenance
